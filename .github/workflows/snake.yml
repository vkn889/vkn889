
name: Generate Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vkn889
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322D3EE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
